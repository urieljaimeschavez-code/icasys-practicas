# Las credenciales se introducen en Render, nunca en este archivo.
services:
  - type: web
    name: icasys-practicas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_DRIVER
        value: postgres
      - key: COOKIE_SECURE
        value: "1"
      - key: PG_CA_FILE
        value: /etc/secrets/prod-ca-2021.crt
      - key: SUPABASE_STORAGE_BUCKET
        value: icasys-evidencias
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
